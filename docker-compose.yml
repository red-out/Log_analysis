# Один контейнер приложения, БД — SQLite внутри контейнера.
# Данные сохраняются в volume, чтобы не терялись при перезапуске.

version: "3.9"

services:
  web:
    build: .
    container_name: log-analysis-web
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      # Файл db.sqlite3 сохраняется здесь
      - db_data:/app/db
      # Медиа и обученные модели
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=log_analysis.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-true}
    restart: unless-stopped

volumes:
  db_data:
  media_data:
